services:
  postgres:
    image: postgres:13
    container_name: consumption_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: consumption_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - consumption-network

  redis:
    image: redis:6.2-alpine
    container_name: consumption_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispassword
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - consumption-network

  swagger-editor:
    image: swaggerapi/swagger-editor
    container_name: consumption_swagger_editor
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - consumption-network
    volumes:
      - ./swagger:/tmp

  minio:
    image: minio/minio:latest
    container_name: consumption_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - consumption-network

  adminer:
    image: adminer:latest
    container_name: consumption_adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    restart: unless-stopped
    networks:
      - consumption-network
    depends_on:
      - postgres

networks:
  consumption-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
